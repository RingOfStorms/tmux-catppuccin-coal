# vim:set ft=tmux:

# --> Catppuccin (Coal)
#
# Fork-only flavor: Mocha with a desaturated neutral ramp.
# Source: https://gist.joshuabell.xyz/ringofstorms/8f1e3afba1b34be6a8d8a78265765f6c
#
# Accents are identical to Mocha, so inherit them and only override the
# neutrals. Keeps this file in sync when upstream rebalances the palette.

source -F "#{d:current_file}/catppuccin_mocha_tmux.conf"

set -gF @thm_bg "#262626"
set -gF @thm_fg "#e0e0e0"

set -gF @thm_subtext_1 "#b8b8b8"
set -gF @thm_subtext_0 "#cccccc"
set -gF @thm_overlay_2 "#a3a3a3"
set -gF @thm_overlay_1 "#8c8c8c"
set -gF @thm_overlay_0 "#787878"
set -gF @thm_surface_2 "#636363"
set -gF @thm_surface_1 "#4f4f4f"
set -gF @thm_surface_0 "#3b3b3b"
set -gF @thm_mantle "#1f1f1f"
set -gF @thm_crust "#171717"
