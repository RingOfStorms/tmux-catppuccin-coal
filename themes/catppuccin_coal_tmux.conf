# vim:set ft=tmux:

# --> Catppuccin (Coal)
#
# Fork-only flavor: Mocha with a desaturated neutral ramp.
# Source: https://gist.joshuabell.xyz/ringofstorms/8f1e3afba1b34be6a8d8a78265765f6c
#
# Accents are identical to Mocha, so they are inherited from it rather than
# duplicated. Order matters: the neutrals below are set first with `-ogq`, so
# Mocha's own `-ogq` assignments leave them alone, and a user override set
# before the plugin loads still wins for both files.
#
# Keeps this file in sync when upstream rebalances the palette.

set -ogq @thm_bg "#262626"
set -ogq @thm_fg "#e0e0e0"

set -ogq @thm_subtext_1 "#b8b8b8"
set -ogq @thm_subtext_0 "#cccccc"
set -ogq @thm_overlay_2 "#a3a3a3"
set -ogq @thm_overlay_1 "#8c8c8c"
set -ogq @thm_overlay_0 "#787878"
set -ogq @thm_surface_2 "#636363"
set -ogq @thm_surface_1 "#4f4f4f"
set -ogq @thm_surface_0 "#3b3b3b"
set -ogq @thm_mantle "#1f1f1f"
set -ogq @thm_crust "#171717"

source -F "#{d:current_file}/catppuccin_mocha_tmux.conf"
